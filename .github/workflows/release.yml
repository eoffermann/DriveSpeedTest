name: Build & release Windows exe

# Push a version tag (e.g. `git tag v1.0.0 && git push origin v1.0.0`) to build the
# single-file exe and attach it to a GitHub Release. Also runnable manually from the
# Actions tab (produces a downloadable artifact without creating a release).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build React frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Install Python deps + PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build single-file exe
        run: pyinstaller --noconfirm --clean DriveSpeedTest.spec

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: DriveSpeedTest-exe
          path: dist/DriveSpeedTest.exe

      - name: Attach exe to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/DriveSpeedTest.exe
          generate_release_notes: true
